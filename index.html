<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafaf7; color: #222; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: center; }
  main { max-width: 40rem; margin: 1.5rem auto; padding: 0 1rem; }
  li { margin: .4em 0; }
  li[data-color=red] { background: #ffdede; }
  li[data-color=green] { background: #def5df; }
  li[data-color=blue] { background: #dfeaff; }
  header select { margin-left: auto; }
  [data-id=tags] button { margin: .2em .3em .2em 0; border-radius: 1em; }
  [data-id=tags] button[aria-pressed=true] { font-weight: bold; text-decoration: underline; }
  :root[data-theme=dark] body { background: #16181d; color: #e8e8e8; }
  :root[data-theme=dark] header { border-bottom-color: #333; }
  :root[data-theme=dark] li[data-color=red] { background: #542d32; }
  :root[data-theme=dark] li[data-color=green] { background: #294b32; }
  :root[data-theme=dark] li[data-color=blue] { background: #2d3e5c; }
  footer { max-width: 40rem; margin: 0 auto; padding: 0 1rem; }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: .6rem 1rem; border-radius: .4rem; display: flex; gap: .75rem; align-items: center; }
  .toast[hidden] { display: none; }
</style>
<script>
  // Classic (blocking) script: applies the saved theme before the body is parsed, so before first paint. Key matches src/theme.js.
  try { document.documentElement.dataset.theme = localStorage.getItem('theme.v1') === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>
<header>
  <h1>Notes</h1>
  <input data-id="search" type="search" placeholder="Search notes" aria-label="Search notes">
  <label><input data-id="star-filter" type="checkbox"> Starred only</label>
  <select data-id="sort" aria-label="Sort notes">
    <option value="newest">newest</option>
    <option value="oldest">oldest</option>
  </select>
  <button data-id="theme" type="button">Dark theme</button>
</header>
<main>
  <form data-id="form">
    <input data-id="text" placeholder="Write a note" aria-label="Note text">
    <span data-id="remaining">280</span>
    <button data-id="add">Add</button>
  </form>
  <div data-id="tags"></div>
  <p data-id="empty-state" hidden>No notes yet</p>
  <ul data-id="list"></ul>
  <p><button data-id="export" type="button">Export notes.json</button>
  <label>Import <input data-id="import" type="file" accept=".json,application/json"></label>
  <button data-id="clear-all" type="button">Clear all</button></p>
</main>
<footer><p data-id="count"></p><p data-id="words">0 words</p></footer>
<div data-id="toast" class="toast" role="status" hidden>
  <span data-id="toast-text"></span>
  <button data-id="undo" type="button">Undo</button>
</div>
<script type="module">
  import { createNote, listNotes } from './src/notes.js';
  import { deleteNote, renderDeleteButton } from './src/delete.js';
  import { filterNotes } from './src/search.js';
  import { getTheme, setTheme } from './src/theme.js';
  import { togglePin, sortPinned } from './src/pin.js';
  import { filterStarred, toggleStar } from './src/star.js';
  import { editNote } from './src/edit.js';
  import { duplicateNote } from './src/duplicate.js';
  import { startUndo } from './src/undo.js';
  import { extractTags, filterByTag, resolveActiveTag } from './src/tags.js';
  import { toJson } from './src/export.js';
  import { countText } from './src/count.js';
  import { wordCount } from './src/words.js';
  import { formatCreated } from './src/created.js';
  import { truncateNote } from './src/truncate.js';
  import { emptyMessage } from './src/emptystate.js';
  import { remaining, canSave } from './src/limit.js';
  import { sortNotes, getSort, setSort } from './src/sort.js';
  import { setColor } from './src/color.js';
  import { parseImport, mergeImport } from './src/import.js';
  import { shouldClear } from './src/clear.js';
  import { KEY } from './src/notes.js';
  const themeBtn = document.querySelector('[data-id=theme]');
  const applyTheme = (name) => { document.documentElement.dataset.theme = name; themeBtn.textContent = name === 'dark' ? 'Light theme' : 'Dark theme'; };
  applyTheme(getTheme(localStorage));
  themeBtn.addEventListener('click', () => { const next = getTheme(localStorage) === 'dark' ? 'light' : 'dark'; setTheme(localStorage, next); applyTheme(next); });
  const list = document.querySelector('[data-id=list]');
  const search = document.querySelector('[data-id=search]');
  const starFilter = document.querySelector('[data-id=star-filter]');
  starFilter.checked = localStorage.getItem('star-filter.v1') === 'true';
  starFilter.addEventListener('change', () => { localStorage.setItem('star-filter.v1', String(starFilter.checked)); render(); });
  const sortSel = document.querySelector('[data-id=sort]');
  sortSel.value = getSort(localStorage);
  sortSel.addEventListener('change', () => { setSort(localStorage, sortSel.value); render(); });
  let editingId = null;
  const toast = document.querySelector('[data-id=toast]');
  const toastText = document.querySelector('[data-id=toast-text]');
  let pending = null; // { id, cancel }: a deleted note waiting out its undo countdown
  const tagBar = document.querySelector('[data-id=tags]');
  let activeTag = null;
  const renderTags = (notes) => {
    const all = [...new Set(notes.flatMap((n) => extractTags(n.text)))];
    tagBar.innerHTML = '';
    for (const t of all) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.dataset.id = 'tag';
      chip.dataset.tag = t;
      chip.textContent = '#' + t;
      chip.setAttribute('aria-pressed', String(activeTag === t));
      chip.addEventListener('click', () => { activeTag = activeTag === t ? null : t; render(); });
      tagBar.append(chip);
    }
  };
  const render = () => {
    const notes = listNotes(localStorage);
    activeTag = resolveActiveTag(notes, activeTag);
    renderTags(notes);
    document.querySelector('[data-id=count]').textContent = countText(notes.length);
    document.querySelector('[data-id=words]').textContent = `${wordCount(notes)} words`;
    const emptyState = document.querySelector('[data-id=empty-state]');
    emptyState.textContent = emptyMessage(notes);
    emptyState.hidden = emptyState.textContent === '';
    list.innerHTML = '';
    for (const n of sortPinned(sortNotes(filterStarred(filterByTag(filterNotes(notes, search.value), activeTag), starFilter.checked), getSort(localStorage))).filter((n) => !pending || n.id !== pending.id)) {
      const li = document.createElement('li');
      li.dataset.id = 'note';
      li.dataset.noteId = String(n.id);
      li.dataset.color = ['none', 'red', 'green', 'blue'].includes(n.color) ? n.color : 'none';
      if (editingId === n.id) {
        const input = document.createElement('input');
        input.dataset.id = 'edit-text';
        input.value = n.text;
        input.setAttribute('aria-label', 'Edit note text');
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          editNote(localStorage, n.id, input.value);
          editingId = null;
          render();
        });
        li.append(input, ' ');
      } else {
        const span = document.createElement('span');
        span.dataset.id = 'note-text';
        span.textContent = truncateNote(n.text, 100);
        li.append(span, ' ');
      }
      const created = document.createElement('span');
      created.dataset.id = 'created';
      created.textContent = formatCreated(n.createdAt);
      li.append(created, ' ');
      const editBtn = document.createElement('button');
      editBtn.dataset.id = 'edit';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => { editingId = n.id; render(); });
      li.append(editBtn, ' ');
      const btn = document.createElement('button');
      btn.dataset.id = 'pin';
      btn.textContent = n.pinned ? 'Unpin' : 'Pin';
      btn.addEventListener('click', () => { togglePin(localStorage, n.id); render(); });
      li.append(btn, ' ');
      const starBtn = document.createElement('button');
      starBtn.dataset.id = 'star';
      starBtn.type = 'button';
      starBtn.textContent = n.starred ? 'Unstar' : 'Star';
      starBtn.setAttribute('aria-pressed', String(Boolean(n.starred)));
      starBtn.addEventListener('click', () => { toggleStar(localStorage, n.id); render(); });
      li.append(starBtn, ' ');
      const duplicateBtn = document.createElement('button');
      duplicateBtn.dataset.id = 'duplicate';
      duplicateBtn.dataset.noteId = String(n.id);
      duplicateBtn.type = 'button';
      duplicateBtn.textContent = 'Duplicate';
      li.append(duplicateBtn, ' ');
      const color = document.createElement('select');
      color.dataset.id = 'color';
      color.setAttribute('aria-label', `Color for note: ${n.text}`);
      for (const name of ['none', 'red', 'green', 'blue']) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        color.append(option);
      }
      color.value = li.dataset.color;
      color.addEventListener('change', () => {
        const notes = listNotes(localStorage);
        setColor(notes, n.id, color.value);
        localStorage.setItem(KEY, JSON.stringify(notes));
        render();
      });
      li.append(color, ' ');
      li.insertAdjacentHTML('beforeend', renderDeleteButton(n));
      list.append(li);
      if (editingId === n.id) li.querySelector('[data-id=edit-text]').focus();
    }
  };
  list.addEventListener('click', (e) => {
    const duplicateBtn = e.target.closest('[data-id=duplicate]');
    if (duplicateBtn) {
      const id = Number(duplicateBtn.dataset.noteId);
      const notes = listNotes(localStorage);
      const duplicated = duplicateNote(notes, id);
      if (duplicated === notes) return;
      localStorage.setItem(KEY, JSON.stringify(duplicated));
      render();
      const sourceEl = list.querySelector(`[data-note-id="${id}"]`);
      const copyId = Math.max(...duplicated.map((note) => note.id));
      const copyEl = list.querySelector(`[data-note-id="${copyId}"]`);
      if (sourceEl && copyEl) sourceEl.after(copyEl);
      return;
    }
    const b = e.target.closest('[data-id=delete]');
    if (!b) return;
    if (pending) { pending.cancel(); deleteNote(localStorage, pending.id); pending = null; }
    const id = Number(b.dataset.noteId);
    if (editingId === id) editingId = null;
    pending = { id, cancel: null };
    pending.cancel = startUndo(
      (n) => { toastText.textContent = `Note deleted. Undo (${n})`; toast.hidden = false; },
      () => { deleteNote(localStorage, id); pending = null; toast.hidden = true; render(); },
    );
    render();
  });
  document.querySelector('[data-id=undo]').addEventListener('click', () => {
    if (!pending) return;
    pending.cancel();
    pending = null;
    toast.hidden = true;
    render();
  });
  const MAX = 280;
  const textInput = document.querySelector('[data-id=text]');
  const remainingEl = document.querySelector('[data-id=remaining]');
  const updateRemaining = () => { remainingEl.textContent = String(remaining(textInput.value, MAX)); };
  document.querySelector('[data-id=form]').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.querySelector('[data-id=text]');
    if (input.value.trim() && canSave(input.value, MAX)) { createNote(localStorage, input.value); input.value = ''; updateRemaining(); render(); }
  });
  textInput.addEventListener('input', updateRemaining);
  document.querySelector('[data-id=export]').addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([toJson(listNotes(localStorage))], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'notes.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  });
  document.querySelector('[data-id=import]').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const merged = mergeImport(listNotes(localStorage), parseImport(await file.text()));
      localStorage.setItem(KEY, JSON.stringify(merged));
      render();
    } catch (err) {
      alert(err.message);
    }
    e.target.value = '';
  });
  document.querySelector('[data-id=clear-all]').addEventListener('click', () => {
    if (!shouldClear(confirm('Clear all notes?'), listNotes(localStorage))) return;
    if (pending) { pending.cancel(); pending = null; }
    toast.hidden = true;
    editingId = null;
    localStorage.setItem(KEY, JSON.stringify([]));
    render();
  });
  search.addEventListener('input', render);
  render();
</script>
</body>
</html>
